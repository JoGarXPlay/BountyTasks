# ============================================================
# BountyTasks - Task Configuration
# ============================================================
#
# Puedes agregar, modificar o eliminar tareas libremente.
#
# Cada tarea debe tener:
#
#   id:
#     name: "Nombre de la tarea"
#     material: MATERIAL
#     requirements:
#       - type: ITEM
#         material: MATERIAL_REQUERIDO
#         amount: CANTIDAD
#     rewards:
#       - type: ITEM
#         material: MATERIAL_RECOMPENSA
#         amount: CANTIDAD
#
# ------------------------------------------------------------
# id
# ------------------------------------------------------------
# Identificador único de la tarea.
# No debe repetirse entre tareas.
# Se recomienda utilizar un nombre descriptivo y sin espacios.
#
# ------------------------------------------------------------
# name
# ------------------------------------------------------------
# Nombre que se mostrará al jugador.
#
# ------------------------------------------------------------
# material
# ------------------------------------------------------------
# Material que se mostrará como icono de la tarea en el menú.
# Debe ser un Material válido de Minecraft.
#
# ------------------------------------------------------------
# requirements
# ------------------------------------------------------------
# Objetos que el jugador debe entregar para completar la tarea.
#
# type: ITEM
# Indica que el requisito es un objeto.
#
# material:
# Material requerido.
#
# amount:
# Cantidad requerida.
#
# ------------------------------------------------------------
# rewards
# ------------------------------------------------------------
# Objetos que el jugador recibirá al completar la tarea.
#
# type: ITEM
# Indica que la recompensa es un objeto.
#
# material:
# Material que recibirá el jugador.
#
# amount:
# Cantidad de objetos que recibirá.
#
# ============================================================
# EJEMPLO
# ============================================================
#
# Puedes copiar este bloque para crear una nueva tarea.
# Recuerda cambiar el id, nombre, materiales y cantidades.
#
# smooth_stone:
#   name: "Constructor experto"
#   material: BOOK
#   requirements:
#     - type: ITEM
#       material: SMOOTH_STONE
#       amount: 64
#   rewards:
#     - type: ITEM
#       material: DIAMOND_SWORD
#       amount: 1
#
# ============================================================
# TAREAS
# ============================================================
